%YAML 1.2
---
$id: http://devicetree.org/schemas/devfreq/event/rockchip,dfi.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Rockchip DFI

maintainers:
  - Sascha Hauer <s.hauer@pengutronix.de>

properties:
  compatible:
    enum:
      - rockchip,rk3399-dfi
      - rockchip,rk3568-dfi
      - rockchip,rk3576-dfi
      - rockchip,rk3588-dfi

  clocks:
    minItems: 1
    maxItems: 4

  clock-names:
    minItems: 1
    maxItems: 4
    items:
      - enum:
          - pclk_ddr_mon
          - pclk_ddr_mon_ch0
      - const: pclk_ddr_mon_ch1
      - const: pclk_ddr_mon_ch2
      - const: pclk_ddr_mon_ch3

  interrupts:
    minItems: 1
    maxItems: 4

  reg:
    maxItems: 1

  rockchip,pmu:
    $ref: /schemas/types.yaml#/definitions/phandle
    description:
      Phandle to the syscon managing the "PMU general register files".

required:
  - compatible
  - interrupts
  - reg

allOf:
  - if:
      properties:
        compatible:
          contains:
            enum:
              - rockchip,rk3399-dfi
    then:
      properties:
        clocks:
          items:
            - description:
                clock driving the DDR monitoring logic for all channels
        clock-names:
          items:
            - const: pclk_ddr_mon
      required:
        - clocks
        - clock-names

  - if:
      properties:
        compatible:
          contains:
            enum:
              - rockchip,rk3576-dfi
    then:
      properties:
        clocks:
          items:
            - description:
                clock driving the DDR monitoring logic for memory channel 0
            - description:
                clock driving the DDR monitoring logic for memory channel 1
        clock-names:
          items:
            - const: pclk_ddr_mon_ch0
            - const: pclk_ddr_mon_ch1
      required:
        - clocks
        - clock-names

  - if:
      properties:
        compatible:
          contains:
            enum:
              - rockchip,rk3588-dfi
    then:
      properties:
        clocks:
          items:
            - description:
                clock driving the DDR monitoring logic for memory channel 0
            - description:
                clock driving the DDR monitoring logic for memory channel 1
            - description:
                clock driving the DDR monitoring logic for memory channel 2
            - description:
                clock driving the DDR monitoring logic for memory channel 3
        clock-names:
          items:
            - const: pclk_ddr_mon_ch0
            - const: pclk_ddr_mon_ch1
            - const: pclk_ddr_mon_ch2
            - const: pclk_ddr_mon_ch3

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/clock/rk3308-cru.h>

    bus {
      #address-cells = <2>;
      #size-cells = <2>;

      dfi: dfi@ff630000 {
        compatible = "rockchip,rk3399-dfi";
        reg = <0x00 0xff630000 0x00 0x4000>;
        interrupts = <GIC_SPI 131 IRQ_TYPE_LEVEL_HIGH 0>;
        rockchip,pmu = <&pmugrf>;
        clocks = <&cru PCLK_DDR_MON>;
        clock-names = "pclk_ddr_mon";
      };
    };

  - |
    bus {
      #address-cells = <2>;
      #size-cells = <2>;

      dfi_rk3588: dfi@fe060000 {
        compatible = "rockchip,rk3588-dfi";
        reg = <0x00 0xfe060000 0x00 0x10000>;
        clocks = <&cru 0x53>, <&cru 0x48>, <&cru 0x49>, <&cru 0x54>;
        clock-names = "pclk_ddr_mon_ch0", "pclk_ddr_mon_ch1",
                      "pclk_ddr_mon_ch2", "pclk_ddr_mon_ch3";
        interrupts =  <GIC_SPI 28 IRQ_TYPE_LEVEL_HIGH 0>,
                      <GIC_SPI 38 IRQ_TYPE_LEVEL_HIGH 0>,
                      <GIC_SPI 48 IRQ_TYPE_LEVEL_HIGH 0>,
                      <GIC_SPI 58 IRQ_TYPE_LEVEL_HIGH 0>;
        rockchip,pmu = <&pmugrf>;
      };
    };
