%YAML 1.2
---
$id: http://devicetree.org/schemas/phy/rockchip,rk3588-hdptx-phy.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Rockchip SoC HDMI/eDP Transmitter Combo PHY

maintainers:
  - Cristian Ciocaltea <cristian.ciocaltea@collabora.com>

properties:
  compatible:
    oneOf:
      - enum:
          - rockchip,rk3588-hdptx-phy
      - items:
          - enum:
              - rockchip,rk3576-hdptx-phy
          - const: rockchip,rk3588-hdptx-phy

  reg:
    maxItems: 1

  clocks:
    items:
      - description: Reference clock
      - description: APB clock

  clock-names:
    items:
      - const: ref
      - const: apb

  "#clock-cells":
    const: 0

  "#phy-cells":
    const: 0

  resets:
    minItems: 4
    maxItems: 7

  reset-names:
    minItems: 4
    maxItems: 7

  avdd-0v75-supply:
    description:
      Supply for the 0.75V digital and analog power pins of the PHY, i.e.
      VDD_0V75 and AVDD_0V75 on RK3588, AVDDD0V75 and AVDDC0V75 on RK3576.

  vddio-1v8-supply:
    description:
      Supply for the 1.8V common and I/O power pins of the PHY, i.e.
      VDD_CMN_1V8 and VDD_IO_1V8 on RK3588, AVDDCMN1V8 and AVDDIO1V8 on
      RK3576.

  rockchip,grf:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: Some PHY related data is accessed through GRF regs.

required:
  - compatible
  - reg
  - clocks
  - clock-names
  - "#phy-cells"
  - resets
  - reset-names
  - rockchip,grf

allOf:
  - if:
      properties:
        compatible:
          contains:
            enum:
              - rockchip,rk3576-hdptx-phy
    then:
      properties:
        resets:
          minItems: 4
          maxItems: 4
        reset-names:
          items:
            - const: apb
            - const: init
            - const: cmn
            - const: lane
    else:
      properties:
        resets:
          minItems: 7
          maxItems: 7
        reset-names:
          items:
            - const: phy
            - const: apb
            - const: init
            - const: cmn
            - const: lane
            - const: ropll
            - const: lcpll

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/rockchip,rk3588-cru.h>
    #include <dt-bindings/reset/rockchip,rk3588-cru.h>

    soc {
      #address-cells = <2>;
      #size-cells = <2>;

      phy@fed60000 {
        compatible = "rockchip,rk3588-hdptx-phy";
        reg = <0x0 0xfed60000 0x0 0x2000>;
        clocks = <&cru CLK_USB2PHY_HDPTXRXPHY_REF>, <&cru PCLK_HDPTX0>;
        clock-names = "ref", "apb";
        #phy-cells = <0>;
        resets = <&cru SRST_HDPTX0>, <&cru SRST_P_HDPTX0>,
                 <&cru SRST_HDPTX0_INIT>, <&cru SRST_HDPTX0_CMN>,
                 <&cru SRST_HDPTX0_LANE>, <&cru SRST_HDPTX0_ROPLL>,
                 <&cru SRST_HDPTX0_LCPLL>;
        reset-names = "phy", "apb", "init", "cmn", "lane", "ropll", "lcpll";
        avdd-0v75-supply = <&avdd_0v75_s0>;
        vddio-1v8-supply = <&avcc_1v8_s0>;
        rockchip,grf = <&hdptxphy_grf>;
      };
    };
